# Tool configuration only. This repository is a composite action, not a
# Python package, so there is deliberately no [project] table.

[tool.basedpyright]
# No requires-python exists to read. The helper in src/ runs under the
# interpreter the caller's python_version input selects, so target the
# oldest CPython the action supports.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
# Matches the directories the pre-commit hook passes, so a bare
# basedpyright run or an editor's language server analyses the same set.
include = ["src", "tests"]
# The tests import the helper as a top-level module after putting src/
# on sys.path, so resolve it from there.
extraPaths = ["src"]
